name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Dart ${{ matrix.dart }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dart: ['stable', '3.2']
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart }}

      - run: dart pub get

      # Soft format check — show diff but don't fail CI. Re-enable strict mode
      # once a contributor has run `dart format .` and committed the canonical
      # formatting.
      - name: Show formatter diff (informational)
        if: matrix.dart == 'stable'
        run: dart format --output=none . || true

      - name: Analyse
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test
